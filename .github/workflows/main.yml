name: Discord Bot Runner

on:
  schedule:
    # Kita suruh GitHub buat ngecek/jalanin tiap jam 
    # (Biar kalau sesi sebelumnya mati, sesi baru cepet masuk antrean)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Biar gak numpuk, kalau ada sesi baru, sesi lama dimatikan otomatis
    concurrency:
      group: discord-bot
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Discord Bot
        # Kita set timeout 1 jam (3600s) saja 
        # Jadi tiap jam dia refresh, bot makin jarang offline
        run: timeout 3600s node index.js || true
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
